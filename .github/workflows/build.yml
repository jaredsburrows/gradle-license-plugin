name: build

on:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, labeled, unlabeled, synchronize ]

# Cancel superseded runs for the same PR/branch (saves runner minutes on rapid pushes, e.g.
# Renovate, and gives faster feedback on the latest commit); let master runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  JAVA_VERSION: 21

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: ./gradlew --version

      - name: Ktlint Check, Build, and Unit Tests with --continue
        run: ./gradlew ktlintCheck build -s --continue

      - name: Publish Plugin Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2.24.0
        if: always()
        with:
          check_name: Test Plugin Results
          comment_mode: off
          action_fail_on_inconclusive: true
          files: '**/build/test-results/test/TEST-*.xml'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        if: github.repository == 'jaredsburrows/gradle-license-plugin' && github.ref == 'refs/heads/master'
        with:
          name: gradle-license-plugin-${{ github.workflow }}-${{ github.run_id }}
          # The plugin is the :gradle-license-plugin subproject, so its outputs are under
          # gradle-license-plugin/build. The root build/libs holds only the near-empty jar the root
          # project produces from java-library, and root build/reports is configuration-cache
          # diagnostics rather than anything worth keeping.
          path: |
            gradle-license-plugin/build/libs
            gradle-license-plugin/build/reports
            gradle-license-plugin/build/test-results

  test-apps:
    name: Test Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: ./gradlew --version

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('test-apps/gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-

      # The test apps are a separate build that includes this one, so they always run against the
      # plugin sources in this commit.
      - name: Build the Jetpack Compose Test Apps
        run: ./gradlew -p test-apps build -s

      - name: Verify the Reports were Copied to the Test App Assets
        run: |
          test -s test-apps/test-app-compose-html/src/debug/assets/open_source_licenses.html
          test -s test-apps/test-app-compose-html/src/release/assets/open_source_licenses.html
          test -s test-apps/test-app-compose-json/src/debug/assets/open_source_licenses.json
          test -s test-apps/test-app-compose-json/src/release/assets/open_source_licenses.json
          test -s test-apps/test-app-compose-fulljson/src/debug/assets/open_source_licenses.full.json
          test -s test-apps/test-app-compose-fulljson/src/release/assets/open_source_licenses.full.json

      - name: Publish Test Apps Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2.24.0
        if: always()
        with:
          check_name: Test App Results
          comment_mode: off
          action_fail_on_inconclusive: true
          files: 'test-apps/**/build/test-results/**/TEST-*.xml'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        if: github.repository == 'jaredsburrows/gradle-license-plugin' && github.ref == 'refs/heads/master'
        with:
          name: test-apps-${{ github.workflow }}-${{ github.run_id }}
          path: |
            test-apps/*/build/outputs/apk
            test-apps/*/build/reports
            test-apps/*/build/test-results

  publish:
    name: Publish Snapshot
    runs-on: ubuntu-latest
    if: github.repository == 'jaredsburrows/gradle-license-plugin' && github.ref == 'refs/heads/master'
    needs:
      - build
      - test-apps

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: ./gradlew --version

      - name: Publish
        run: ./gradlew publish -s -i
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Generate Docs
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Publish Website
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gradle-license-plugin/build/dokka/html
          user_name: "Github Actions"
          user_email: "action@github.com"
